<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RepairWise | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">

    <div class="left">
        <h1>RepairWise</h1>
        <h2>AI-Powered Damage Detection</h2>
        <p>
            Scan vehicle images, detect damage instantly,
            and get smart repair suggestions.
        </p>

        <div class="stats">
            <div class="stat-box">85%<br><span>Accuracy</span></div>
            <div class="stat-box green">Low<br><span>Damage</span></div>
        </div>
    </div>

    <div class="right">
        <h2>Welcome Back</h2>
        <p>Sign in to continue analyzing</p>

        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">

        <button class="btn">Sign In →</button>

        <p class="small">Don't have an account? Sign up</p>
    </div>

</div>

</body>
</html>
